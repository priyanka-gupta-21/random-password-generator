<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Password Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
      width: 400px;
      max-width: 90%;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }

    .password-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    #password {
      flex: 1;
      padding: 13px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .copy-btn {
      padding: 0 15px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .copy-btn:hover {
      background: #5568d9;
    }

    .option {
      margin: 15px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #444;
    }

    input[type="number"] {
      width: 70px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #2ed573;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate-btn:hover {
      background: #20bf6b;
    }

    .strength {
      margin-top: 20px;
    }

    .strength-text {
      margin-bottom: 8px;
      font-weight: bold;
    }

    .strength-bar {
      width: 100%;
      height: 8px;
      background: #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    #strengthFill {
      height: 100%;
      width: 0%;
      transition: 0.3s;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #2ed573;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔐 Password Generator</h1>

    <div class="password-box">
      <input type="text" id="password" readonly placeholder="Your password">
      <button class="copy-btn" onclick="copyPassword()">Copy</button>
    </div>

    <div class="option">
      <label for="length">Password Length</label>
      <input type="number" id="length" min="4" max="50" value="12">
    </div>

    <div class="option">
      <label for="uppercase">Uppercase (A-Z)</label>
      <input type="checkbox" id="uppercase" checked>
    </div>

    <div class="option">
      <label for="lowercase">Lowercase (a-z)</label>
      <input type="checkbox" id="lowercase" checked>
    </div>

    <div class="option">
      <label for="numbers">Numbers (0-9)</label>
      <input type="checkbox" id="numbers" checked>
    </div>

    <div class="option">
      <label for="symbols">Symbols (!@#$)</label>
      <input type="checkbox" id="symbols" checked>
    </div>

    <button class="generate-btn" onclick="generatePassword()">
      Generate Password
    </button>

    <div class="strength">
      <div class="strength-text">
        Strength: <span id="strengthText">-</span>
      </div>

      <div class="strength-bar">
        <div id="strengthFill"></div>
      </div>
    </div>

    <div id="message"></div>

  </div>


  <script>

    function generatePassword() {

      const length = parseInt(document.getElementById("length").value);

      const uppercase = document.getElementById("uppercase").checked;
      const lowercase = document.getElementById("lowercase").checked;
      const numbers = document.getElementById("numbers").checked;
      const symbols = document.getElementById("symbols").checked;

      const uppercaseChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const lowercaseChars = "abcdefghijklmnopqrstuvwxyz";
      const numberChars = "0123456789";
      const symbolChars = "!@#$%^&*()_+-=[]{}|;:,.<>?";

      let characters = "";

      if (uppercase) characters += uppercaseChars;
      if (lowercase) characters += lowercaseChars;
      if (numbers) characters += numberChars;
      if (symbols) characters += symbolChars;

      if (characters.length === 0) {
        alert("Please select at least one character type.");
        return;
      }

      if (length < 4 || length > 50) {
        alert("Password length must be between 4 and 50.");
        return;
      }

      let password = "";

      for (let i = 0; i < length; i++) {
        const randomIndex = Math.floor(
          Math.random() * characters.length
        );

        password += characters[randomIndex];
      }

      document.getElementById("password").value = password;

      checkStrength(password);
    }


    function copyPassword() {

      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (password === "") {
        message.textContent = "Generate a password first!";
        return;
      }

      navigator.clipboard.writeText(password);

      message.textContent = "✅ Password copied!";

      setTimeout(() => {
        message.textContent = "";
      }, 2000);
    }


    function checkStrength(password) {

      let score = 0;

      if (password.length >= 8) score++;
      if (password.length >= 12) score++;
      if (/[A-Z]/.test(password)) score++;
      if (/[a-z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;

      const fill = document.getElementById("strengthFill");
      const text = document.getElementById("strengthText");

      if (score <= 2) {
        text.textContent = "Weak";
        text.style.color = "#ff4757";
        fill.style.width = "30%";
        fill.style.background = "#ff4757";
      }
      else if (score <= 4) {
        text.textContent = "Medium";
        text.style.color = "#ffa502";
        fill.style.width = "60%";
        fill.style.background = "#ffa502";
      }
      else {
        text.textContent = "Strong";
        text.style.color = "#2ed573";
        fill.style.width = "100%";
        fill.style.background = "#2ed573";
      }
    }


    // Generate a password automatically when the page loads
    generatePassword();

  </script>

</body>
</html>
